[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/gpx-api/*"
  to = "https://iridemallorca-d6e5h4f5bvdah4hs.westeurope-01.azurewebsites.net/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404


[[headers]]
  for = "/routes/gpx/*"
  [headers.values]
    Content-Type = "application/gpx+xml; charset=utf-8"
    Content-Disposition = "attachment"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
