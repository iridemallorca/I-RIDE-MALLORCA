name: Deploy I Ride Mallorca GPX API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/main_iridemallorca.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --omit=dev
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_64F673AFA4A54A6FB4EB3A907F58D4D1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3077F4B865654A028C5BF93447907C14 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_211211927CC84C80BD98ECC08F577CFA }}
      - name: Deploy GPX API
        uses: azure/webapps-deploy@v3
        with:
          app-name: iridemallorca
          slot-name: Production
          package: backend
