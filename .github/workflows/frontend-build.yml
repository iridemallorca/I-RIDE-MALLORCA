name: Check frontend build
on:
  push:
    paths:
      - "src/**"
      - "scripts/**"
      - "index.html"
      - "vite.config.ts"
      - "netlify.toml"
      - "package*.json"
      - "tsconfig.json"
      - ".github/workflows/frontend-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:seo
